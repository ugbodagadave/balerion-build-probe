name: laned-fe
on:
  push:
    branches: [laneD]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t laned-fe:v1 laneD/feimage
      - name: Push to ghcr
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag laned-fe:v1 ghcr.io/ugbodagadave/laned-fe:v1
          docker push ghcr.io/ugbodagadave/laned-fe:v1
      - name: Try set package public
        run: |
          curl -sS -X PATCH -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/laned-fe -d '{"visibility":"public"}' | head -c 400; echo
      - name: Backup push to ttl.sh
        run: |
          docker tag laned-fe:v1 ttl.sh/laned-fe-b4c1d2e3-5f6a-7b8c-9d0e-1f2a3b4c5d6e:2h
          docker push ttl.sh/laned-fe-b4c1d2e3-5f6a-7b8c-9d0e-1f2a3b4c5d6e:2h || true
